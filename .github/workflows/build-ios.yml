name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FIREBASE_SDK_VERSION: '10.28.0'

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Generate iOS native project (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: Pin Firebase to stable 10.28.0 (Xcode 15 compatible)
        run: |
          node -e '
          const fs = require("fs");
          const podfilePath = "ios/Podfile";
          if (fs.existsSync(podfilePath)) {
            let content = fs.readFileSync(podfilePath, "utf8");
            const pin = `
          pod "FirebaseCoreInternal", "10.28.0"
          pod "Firebase/CoreOnly", "10.28.0"
          pod "Firebase/Analytics", "10.28.0"
          `;
            content = content.replace("use_expo_modules!", pin + "\n  use_expo_modules!");
            fs.writeFileSync(podfilePath, content);
            console.log("Successfully pinned Firebase to 10.28.0");
          }
          '

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build Xcode Archive (Unsigned)
        run: |
          cd ios
          xcodebuild -workspace IpoShayak.xcworkspace \
            -scheme IpoShayak \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/IpoShayak.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package App into IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/IpoShayak.xcarchive/Products/Applications/IpoShayak.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r "$GITHUB_WORKSPACE/IpoShayak.ipa" Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IpoShayak-iOS-IPA
          path: IpoShayak.ipa
          retention-days: 14
