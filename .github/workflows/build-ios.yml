name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.1.app 2>/dev/null || sudo xcode-select -s /Applications/Xcode_16.0.app 2>/dev/null || sudo xcode-select -s /Applications/Xcode_16.app 2>/dev/null || true
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Generate iOS native project (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: Configure Podfile for Swift compatibility
        run: |
          node -e '
          const fs = require("fs");
          const podfilePath = "ios/Podfile";
          if (fs.existsSync(podfilePath)) {
            let content = fs.readFileSync(podfilePath, "utf8");
            const patch = `
              installer.pods_project.targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings["OTHER_SWIFT_FLAGS"] ||= ["$(inherited)"]
                  config.build_settings["OTHER_SWIFT_FLAGS"] << "-enable-experimental-feature"
                  config.build_settings["OTHER_SWIFT_FLAGS"] << "AccessLevelOnImport"
                end
              end
            `;
            if (content.includes("post_install do |installer|")) {
              content = content.replace("post_install do |installer|", "post_install do |installer|\n" + patch);
            } else {
              content += "\npost_install do |installer|\n" + patch + "\nend\n";
            }
            fs.writeFileSync(podfilePath, content);
            console.log("Podfile successfully patched for Swift compatibility");
          }
          '

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build Xcode Archive (Unsigned)
        run: |
          cd ios
          xcodebuild -workspace IpoShayak.xcworkspace \
            -scheme IpoShayak \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/IpoShayak.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package App into IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/IpoShayak.xcarchive/Products/Applications/IpoShayak.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r "$GITHUB_WORKSPACE/IpoShayak.ipa" Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IpoShayak-iOS-IPA
          path: IpoShayak.ipa
          retention-days: 14
