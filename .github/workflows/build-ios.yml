name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Latest Stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode & SDK Info
        run: |
          xcodebuild -version
          xcrun simctl list runtimes || true
          xcodebuild -showsdks

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate iOS native project (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: Configure iOS Deployment Target & Disable Code Signing
        run: |
          cd ios
          # Ensure iOS deployment target is 15.1 across all project targets
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.1;/g' IPOSahayak.xcodeproj/project.pbxproj
          
          # Disable code signing for all targets
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' IPOSahayak.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "";/g' IPOSahayak.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = "";/g' IPOSahayak.xcodeproj/project.pbxproj
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = ".*";/PROVISIONING_PROFILE_SPECIFIER = "";/g' IPOSahayak.xcodeproj/project.pbxproj
          echo "Deployment target set to 15.1 and code signing disabled."

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build Xcode Archive (Ad-hoc Signed for Sideloadly)
        run: |
          cd ios
          xcodebuild archive \
            -workspace IPOSahayak.xcworkspace \
            -scheme IPOSahayak \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/IPOSahayak.xcarchive" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_IDENTITY="-" \
            EXPANDED_CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.1

      - name: Package Archive into IPA
        run: |
          # Find the .app inside the archive
          APP_PATH=$(find "$RUNNER_TEMP/IPOSahayak.xcarchive" -name "IPOSahayak.app" -type d | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: IPOSahayak.app not found in archive!"
            ls -la "$RUNNER_TEMP/"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qr "$GITHUB_WORKSPACE/IPOSahayak.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/IPOSahayak.ipa"
          echo "IPA created successfully!"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPOSahayak-iOS-IPA
          path: IPOSahayak.ipa
          retention-days: 14
